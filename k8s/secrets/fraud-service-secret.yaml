# Defines this Secret in fraud-team.
# Tells Kubernetes which resource type and schema to use.
apiVersion: v1
kind: Secret
metadata:
  # Supplies the name, namespace, and labels used to identify the workload and owner.
  name: fraud-service-secret
  namespace: fraud-team
type: Opaque
# Example secret entries only; this file is not used for deployed SageMaker credentials.
stringData:
  # This repository is intentionally demo-only.
  # The application currently demonstrates model-serving behavior and does not connect to a real database or real external API in this repo.
  # Replace these values before any non-demo deployment.
  API_KEY: "REPLACE_WITH_REAL_API_KEY"
  DB_PASSWORD: "REPLACE_WITH_REAL_DB_PASSWORD"
