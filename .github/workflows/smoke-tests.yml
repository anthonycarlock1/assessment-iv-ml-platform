name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/services/forecasting/requirements.txt || true
          pip install -r apps/services/fraud/requirements.txt || true
          pip install -r apps/services/recommendations/requirements.txt || true

      - name: Run forecasting smoke tests
        run: python -m pytest -q apps/services/forecasting/test_main.py

      - name: Run fraud smoke tests
        run: python -m pytest -q apps/services/fraud/test_main.py

      - name: Run recommendations smoke tests
        run: python -m pytest -q apps/services/recommendations/test_main.py
