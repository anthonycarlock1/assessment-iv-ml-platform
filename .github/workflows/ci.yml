name: CI

# Defines the branches/events that start this workflow.
on:
  push:
    branches: [main, master]
  pull_request:

# Lists the runner jobs and their steps.
jobs:
  validate-services:
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository into the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the required Python interpreter.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs the project libraries.
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      # Runs the Python suite, including routing and inference checks.
      - name: Run service tests
        run: |
          python -m pytest -q apps tests
          python -m pip check

      # Validates infrastructure syntax only if Terraform is installed; otherwise reports a skip.
      - name: Terraform validation (skip if missing)
        run: |
          if command -v terraform >/dev/null 2>&1; then
            echo "Terraform found: $(terraform -version | head -n1)"
            cd terraform
            terraform init -backend=false
            terraform validate
          else
            echo "Terraform not available in runner — skipping terraform validate"
          fi
