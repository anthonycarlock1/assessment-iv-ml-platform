name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/services/fraud/requirements.txt
          pip install -r apps/services/forecasting/requirements.txt
          pip install -r apps/services/recommendations/requirements.txt

      - name: Run service tests
        run: |
          python -m unittest apps/services/fraud/test_main.py
          python -m unittest apps/services/forecasting/test_main.py
          python -m unittest apps/services/recommendations/test_main.py

      - name: Install Terraform
        run: |
          set -euo pipefail
          TF_VERSION=1.6.8
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
            TF_OSARCH="linux_amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            TF_OSARCH="linux_arm64"
          else
            TF_OSARCH="linux_amd64"
          fi
          URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_${TF_OSARCH}.zip"
          echo "Downloading Terraform from: $URL"
          curl -fsSL "$URL" -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          terraform -version

      - name: Terraform validation
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
