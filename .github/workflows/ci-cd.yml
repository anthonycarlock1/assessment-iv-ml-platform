name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/services/fraud/requirements.txt
          pip install -r apps/services/forecasting/requirements.txt
          pip install -r apps/services/recommendations/requirements.txt

      - name: Run service tests
        run: |
          python -m unittest apps/services/fraud/test_main.py
          python -m unittest apps/services/forecasting/test_main.py
          python -m unittest apps/services/recommendations/test_main.py

      - name: Terraform validation
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh --tag "$IMAGE_TAG" --region "$AWS_REGION"

      - name: Deploy to EKS
        env:
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ./scripts/deploy.sh --tag "$IMAGE_TAG" --region "$AWS_REGION"
