name: CI/CD

# Defines the branches/events that start this workflow.
on:
  push:
    branches: [main, master]
  pull_request:

# Lists the runner jobs and their steps.
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository into the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the required Python interpreter.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs the project libraries.
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      # Runs the Python suite, including routing and inference checks.
      - name: Run service tests
        run: |
          python -m pytest -q apps tests
          python -m pip check

      # Installs Node 22 for building the dashboard.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Installs locked dependencies and runs build, lint, and polling tests.
      - name: Validate frontend
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      # Builds a local frontend image and proves missing assets affect readiness without breaking
      # liveness.
      - name: Verify frontend probe semantics
        run: |
          docker build -t assessment-frontend-probes -f dashboard/frontend/Dockerfile .
          bash scripts/verify_frontend_probes.sh assessment-frontend-probes

      # Downloads a pinned Terraform executable for the runner’s OS/CPU.
      - name: Install Terraform (fallback installer)
        run: |
          set -euo pipefail
          TF_VERSION="1.6.8"
          OS_NAME=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH_NAME=$(uname -m)
          case "$ARCH_NAME" in
            x86_64|amd64) ARCH_NAME="amd64" ;;
            aarch64|arm64) ARCH_NAME="arm64" ;;
            *) echo "Unsupported arch: $ARCH_NAME" >&2; exit 1 ;;
          esac
          ZIP_NAME="terraform_${TF_VERSION}_${OS_NAME}_${ARCH_NAME}.zip"
          URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${ZIP_NAME}"
          echo "Downloading Terraform from $URL"
          curl -fsSLo "$ZIP_NAME" "$URL"
          unzip -o "$ZIP_NAME"
          sudo mv terraform /usr/local/bin/terraform
          terraform version

      # Initializes providers without a backend and checks Terraform configuration; this does not
      # apply infrastructure.
      - name: Terraform validation
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
          terraform -chdir=dynamodb init -backend=false
          terraform -chdir=dynamodb validate
          terraform -chdir=cloudwatch init -backend=false
          terraform -chdir=cloudwatch validate

  # Runs only after validation passes and only for pushes to the main/master branch.
  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Uses GitHub repository secrets to authenticate the runner. This differs from Pod Identity
      # inside EKS.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds images using the Git commit hash as the release tag.
      - name: Build and push images
        env:
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Install deployment dependencies
        run: python -m pip install -r requirements.txt

      # Runs the tested deploy script against the existing cluster.
      - name: Deploy to EKS
        env:
          AWS_REGION: us-east-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PYTHON=python ./scripts/deploy.sh
