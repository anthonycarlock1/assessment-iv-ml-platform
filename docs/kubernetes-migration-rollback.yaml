# Defines this Deployment in fraud-team.
# Tells Kubernetes which resource type and schema to use.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Supplies the name, namespace, and labels used to identify the workload and owner.
  annotations:
    deployment.kubernetes.io/revision: '7'
  name: forecasting-service
  namespace: fraud-team
spec:
  progressDeadlineSeconds: 600
  # Keeps 2 pod(s) available for this workload.
  replicas: 2
  revisionHistoryLimit: 10
  # Matches this Deployment to its own pod labels.
  selector:
    matchLabels:
      app: forecasting-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  # Defines what each new pod will run.
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-03T12:03:49-05:00'
      creationTimestamp: null
      labels:
        app: forecasting-service
    spec:
      containers:
      # Loads the matching ConfigMap into environment variables.
      - envFrom:
        - configMapRef:
            name: forecasting-config
        # Chooses the built release from the existing ECR repository.
        image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/anthony-assessment4-forecasting:validation-fixes-v1
        imagePullPolicy: Always
        # Calls /health and restarts a stuck process after repeated failure.
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: forecasting
        # Documents the port served inside the container.
        ports:
        - containerPort: 8000
          protocol: TCP
        # Calls /ready; unready pods stop receiving Service traffic.
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        # Requests reserve scheduling capacity; limits cap use.
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: forecasting-sagemaker
      # Selects the ServiceAccount linked to a scoped Pod Identity role.
      serviceAccountName: forecasting-sagemaker
      terminationGracePeriodSeconds: 30
