server {
    # Listens on port 80 and serves compiled frontend files.
    listen 80;
    root /usr/share/nginx/html;
    # Responds when nginx is running; it does not call AWS.
    location = /health { access_log off; return 200 'healthy'; }
    # Returns 503 if the frontend index page is missing.
    location = /ready {
        access_log off;
        if (!-f $document_root/index.html) { return 503 'frontend assets unavailable'; }
        return 200 'ready';
    }
    # Sends API traffic to the gateway in platform-team, with explicit timeouts and request-ID
    # forwarding.
    location /api/ {
        proxy_pass http://gateway-service.platform-team.svc.cluster.local/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 85s;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    # Serves real files when present, otherwise the app’s index page for client-side navigation.
    location / { try_files $uri $uri/ /index.html; }
}
